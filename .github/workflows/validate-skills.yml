name: Skill validation

on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  validate:
    name: Validate skills and Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install official Agent Skills validator
        run: python -m pip install 'git+https://github.com/agentskills/agentskills.git@83021e2be457a9b6679148719c1f6074f0ad975e#subdirectory=skills-ref'
      - name: Validate skill format
        run: |
          for skill in wiki-capture reverse-engineering backend-architecture-review tech-article-curation cs-learning-visualization; do
            skills-ref validate "$skill"
            skills-ref validate "plugins/$skill/skills/$skill"
          done
      - name: Validate plugin packages
        run: python scripts/package_plugins.py --check
      - name: Check educational SVG examples
        run: python scripts/check_learning_visuals.py
      - name: Check Markdown structure
        run: python scripts/check_markdown.py
