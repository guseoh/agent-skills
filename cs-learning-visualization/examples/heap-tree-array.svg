<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="viz-title viz-desc" viewBox="0 0 1000 530" data-example="heap-tree-array"><title id="viz-title">최소 힙의 트리·배열 대응</title><desc id="viz-desc">값 2,4,7,9,8,11,13이 트리 레벨 순서와 배열 저장 순서에 동일하게 나타나며 모든 부모 값은 자식 이하이다.</desc><style>:root{--bg:#fff;--fg:#171717;--muted:#565656;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#151515;--fg:#f1f1f1;--muted:#b6b6b6;--line:#aaa;--soft:#303030}}.bg{fill:var(--bg)}.line{stroke:var(--line);stroke-width:1.6;fill:none}.div{stroke:var(--line);stroke-width:1}.node{fill:var(--bg);stroke:var(--fg);stroke-width:1.8}.cell{fill:var(--bg);stroke:var(--line);stroke-width:1.3}.soft{fill:var(--soft)}.title{font:600 23px system-ui,sans-serif;fill:var(--fg)}.sub{font:400 15px system-ui,sans-serif;fill:var(--muted)}.label{font:600 17px system-ui,sans-serif;fill:var(--fg)}.small{font:400 14px system-ui,sans-serif;fill:var(--muted)}.mono{font:500 16px ui-monospace,Consolas,monospace;fill:var(--fg)}.value{font:600 19px ui-monospace,Consolas,monospace;fill:var(--fg)}.path{stroke:var(--fg);stroke-width:1.8;fill:none;marker-end:url(#arrow)}.dash{stroke:var(--fg);stroke-width:1.5;fill:none;stroke-dasharray:5 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" style="fill:var(--fg)"/></marker><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="var(--line)"/></pattern></defs><rect class="bg" width="1000" height="530"/><text class="title" x="55" y="49" text-anchor="start">최소 힙 — 트리와 배열이 같은 데이터를 나타낸다</text><text class="sub" x="55" y="79" text-anchor="start">배열 인덱스 i의 자식: 2i+1, 2i+2 · 부모: ⌊(i−1)/2⌋</text><text class="label" x="55" y="125" text-anchor="start">트리</text><line class="line" x1="500" y1="146" x2="310" y2="223"/><line class="line" x1="500" y1="146" x2="690" y2="223"/><line class="line" x1="310" y1="223" x2="225" y2="300"/><line class="line" x1="310" y1="223" x2="395" y2="300"/><line class="line" x1="690" y1="223" x2="605" y2="300"/><line class="line" x1="690" y1="223" x2="775" y2="300"/><circle class="node" cx="500" cy="146" r="25" data-index="0" data-value="2"/><text class="value" x="500" y="152" text-anchor="middle">2</text><text class="small" x="530" y="128" text-anchor="start">i=0</text><circle class="node" cx="310" cy="223" r="25" data-index="1" data-value="4"/><text class="value" x="310" y="229" text-anchor="middle">4</text><text class="small" x="340" y="205" text-anchor="start">i=1</text><circle class="node" cx="690" cy="223" r="25" data-index="2" data-value="7"/><text class="value" x="690" y="229" text-anchor="middle">7</text><text class="small" x="720" y="205" text-anchor="start">i=2</text><circle class="node" cx="225" cy="300" r="25" data-index="3" data-value="9"/><text class="value" x="225" y="306" text-anchor="middle">9</text><text class="small" x="255" y="282" text-anchor="start">i=3</text><circle class="node" cx="395" cy="300" r="25" data-index="4" data-value="8"/><text class="value" x="395" y="306" text-anchor="middle">8</text><text class="small" x="425" y="282" text-anchor="start">i=4</text><circle class="node" cx="605" cy="300" r="25" data-index="5" data-value="11"/><text class="value" x="605" y="306" text-anchor="middle">11</text><text class="small" x="635" y="282" text-anchor="start">i=5</text><circle class="node" cx="775" cy="300" r="25" data-index="6" data-value="13"/><text class="value" x="775" y="306" text-anchor="middle">13</text><text class="small" x="805" y="282" text-anchor="start">i=6</text><line class="div" x1="55" y1="355" x2="945" y2="355"/><text class="label" x="55" y="395" text-anchor="start">배열 (0-based)</text><text class="small" x="235" y="420" text-anchor="middle">0</text><rect class="cell" x="194" y="430" width="82" height="56" data-array-index="0" data-value="2"/><text class="value" x="235" y="464" text-anchor="middle">2</text><text class="small" x="323" y="420" text-anchor="middle">1</text><rect class="cell" x="282" y="430" width="82" height="56" data-array-index="1" data-value="4"/><text class="value" x="323" y="464" text-anchor="middle">4</text><text class="small" x="411" y="420" text-anchor="middle">2</text><rect class="cell" x="370" y="430" width="82" height="56" data-array-index="2" data-value="7"/><text class="value" x="411" y="464" text-anchor="middle">7</text><text class="small" x="499" y="420" text-anchor="middle">3</text><rect class="cell" x="458" y="430" width="82" height="56" data-array-index="3" data-value="9"/><text class="value" x="499" y="464" text-anchor="middle">9</text><text class="small" x="587" y="420" text-anchor="middle">4</text><rect class="cell" x="546" y="430" width="82" height="56" data-array-index="4" data-value="8"/><text class="value" x="587" y="464" text-anchor="middle">8</text><text class="small" x="675" y="420" text-anchor="middle">5</text><rect class="cell" x="634" y="430" width="82" height="56" data-array-index="5" data-value="11"/><text class="value" x="675" y="464" text-anchor="middle">11</text><text class="small" x="763" y="420" text-anchor="middle">6</text><rect class="cell" x="722" y="430" width="82" height="56" data-array-index="6" data-value="13"/><text class="value" x="763" y="464" text-anchor="middle">13</text><text class="sub" x="55" y="512" text-anchor="start">불변식: 모든 부모 값 ≤ 두 자식 값</text></svg>
