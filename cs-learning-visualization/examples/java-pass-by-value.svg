<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="viz-title viz-desc" viewBox="0 0 960 510" data-example="java-pass-by-value"><title id="viz-title">Java의 참조값 전달과 매개변수 재할당</title><desc id="viz-desc">메서드 호출 직후 member와 param은 같은 객체 A를 참조한다. param을 새 객체 B로 재할당해도 호출자의 member는 객체 A를 가리킨다.</desc><style>:root{--bg:#fff;--fg:#171717;--muted:#565656;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#151515;--fg:#f1f1f1;--muted:#b6b6b6;--line:#aaa;--soft:#303030}}.bg{fill:var(--bg)}.line{stroke:var(--line);stroke-width:1.6;fill:none}.div{stroke:var(--line);stroke-width:1}.node{fill:var(--bg);stroke:var(--fg);stroke-width:1.8}.cell{fill:var(--bg);stroke:var(--line);stroke-width:1.3}.soft{fill:var(--soft)}.title{font:600 23px system-ui,sans-serif;fill:var(--fg)}.sub{font:400 15px system-ui,sans-serif;fill:var(--muted)}.label{font:600 17px system-ui,sans-serif;fill:var(--fg)}.small{font:400 14px system-ui,sans-serif;fill:var(--muted)}.mono{font:500 16px ui-monospace,Consolas,monospace;fill:var(--fg)}.value{font:600 19px ui-monospace,Consolas,monospace;fill:var(--fg)}.path{stroke:var(--fg);stroke-width:1.8;fill:none;marker-end:url(#arrow)}.dash{stroke:var(--fg);stroke-width:1.5;fill:none;stroke-dasharray:5 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" style="fill:var(--fg)"/></marker><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="var(--line)"/></pattern></defs><rect class="bg" width="960" height="510"/><text class="title" x="44" y="50" text-anchor="start">Java — 참조값을 복사하고, 매개변수만 재할당한다</text><text class="mono" x="44" y="83" text-anchor="start">Member member = new Member();  change(member);</text><line class="div" x1="480" y1="114" x2="480" y2="428"/><text class="label" x="50" y="136" text-anchor="start">① 메서드 호출 직후</text><text class="label" x="510" y="136" text-anchor="start">② param = new Member() 직후</text><text class="small" x="50" y="167" text-anchor="start">변수</text><text class="small" x="310" y="167" text-anchor="start">객체</text><rect class="cell" x="50" y="191" width="128" height="42"/><text class="mono" x="114" y="218" text-anchor="middle">member</text><rect class="cell" x="50" y="293" width="128" height="42"/><text class="mono" x="114" y="320" text-anchor="middle">param</text><rect data-java-object="A" class="node" x="308" y="174" width="117" height="80"/><text class="label" x="366" y="208" text-anchor="middle">객체 A</text><text class="small" x="366" y="232" text-anchor="middle">Member</text><path class="path" d="M178 212 L306 206" data-reference="member:A"/><path class="path" d="M178 314 L306 235" data-reference="param:A"/><text class="small" x="510" y="167" text-anchor="start">변수</text><text class="small" x="770" y="167" text-anchor="start">객체</text><rect class="cell" x="510" y="191" width="128" height="42"/><text class="mono" x="574" y="218" text-anchor="middle">member</text><rect class="cell" x="510" y="293" width="128" height="42"/><text class="mono" x="574" y="320" text-anchor="middle">param</text><rect data-java-object="A" class="node" x="768" y="174" width="117" height="80"/><text class="label" x="826" y="208" text-anchor="middle">객체 A</text><text class="small" x="826" y="232" text-anchor="middle">Member</text><rect data-java-object="B" class="node" x="768" y="288" width="117" height="80"/><text class="label" x="826" y="322" text-anchor="middle">객체 B</text><text class="small" x="826" y="346" text-anchor="middle">Member</text><path class="path" d="M638 212 L766 212" data-reference="member:A"/><path class="path" d="M638 314 L766 326" data-reference="param:B"/><line class="div" x1="45" y1="430" x2="930" y2="430"/><text class="sub" x="46" y="460" text-anchor="start">member는 계속 객체 A를 가리킨다. param 재할당은 호출자 변수에 영향을 주지 않는다.</text><text class="small" x="46" y="486" text-anchor="start">이 배치는 논리적 참조 관계이며, 물리적 JVM 메모리 배치를 보장하지 않는다.</text></svg>
