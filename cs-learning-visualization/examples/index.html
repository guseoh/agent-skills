<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CS Learning Visualization — Pilot Gallery</title><style>html{color-scheme:light dark;font:16px system-ui,sans-serif}body{max-width:1080px;margin:32px auto;padding:0 24px;line-height:1.6}h1{font-size:24px}h2{font-size:19px;border-top:1px solid #777;padding-top:24px;margin-top:30px}img{display:block;width:100%;height:auto;border:1px solid #888}figcaption{font-size:14px;color:gray}figure{margin:12px 0}</style><h1>CS 학습 시각화 — 세 가지 품질 사례</h1><p>기본은 정적 SVG. OS 테마에 맞춰 라이트·다크 표시가 바뀐다. 그림만으로 개념의 구조와 변화가 보여야 한다.</p><h2>1. Heap: 트리와 배열</h2><figure><img src="heap-tree-array.svg" alt="최소 힙의 완전 이진 트리와 배열 인덱스 대응"><figcaption>완전 이진 트리의 배열 인덱스 및 부모·자식 불변식을 확인한다.</figcaption></figure><h2>2. Java: Pass-by-Value</h2><figure><img src="java-pass-by-value.svg" alt="참조값 복사와 매개변수 재할당 전후 비교"><figcaption>객체 복사가 아니며 호출자의 참조는 유지된다.</figcaption></figure><h2>3. TCP: Sliding Window</h2><figure><img src="tcp-sliding-window.svg" alt="누적 ACK에 따른 바이트 기준 TCP 송신 윈도우 이동"><figcaption>ACK 1200은 다음에 기대하는 바이트를 의미한다.</figcaption></figure></html>
