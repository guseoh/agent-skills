<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="viz-title viz-desc" viewBox="0 0 1040 510" data-example="tcp-sliding-window"><title id="viz-title">TCP 송신 윈도우와 누적 ACK</title><desc id="viz-desc">100바이트 세그먼트 4개를 보낸 뒤 ACK 1200을 수신해 송신 윈도우가 1000~1399에서 1200~1599로 이동한다. 혼잡 윈도우는 제한하지 않는 조건이다.</desc><style>:root{--bg:#fff;--fg:#171717;--muted:#565656;--line:#777;--soft:#eee}@media(prefers-color-scheme:dark){:root{--bg:#151515;--fg:#f1f1f1;--muted:#b6b6b6;--line:#aaa;--soft:#303030}}.bg{fill:var(--bg)}.line{stroke:var(--line);stroke-width:1.6;fill:none}.div{stroke:var(--line);stroke-width:1}.node{fill:var(--bg);stroke:var(--fg);stroke-width:1.8}.cell{fill:var(--bg);stroke:var(--line);stroke-width:1.3}.soft{fill:var(--soft)}.title{font:600 23px system-ui,sans-serif;fill:var(--fg)}.sub{font:400 15px system-ui,sans-serif;fill:var(--muted)}.label{font:600 17px system-ui,sans-serif;fill:var(--fg)}.small{font:400 14px system-ui,sans-serif;fill:var(--muted)}.mono{font:500 16px ui-monospace,Consolas,monospace;fill:var(--fg)}.value{font:600 19px ui-monospace,Consolas,monospace;fill:var(--fg)}.path{stroke:var(--fg);stroke-width:1.8;fill:none;marker-end:url(#arrow)}.dash{stroke:var(--fg);stroke-width:1.5;fill:none;stroke-dasharray:5 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" style="fill:var(--fg)"/></marker><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="var(--line)"/></pattern></defs><rect class="bg" width="1040" height="510"/><text class="title" x="52" y="48" text-anchor="start">TCP 송신 윈도우 — 누적 ACK 뒤 범위 이동</text><text class="sub" x="52" y="78" text-anchor="start">각 데이터 100 B · rwnd = 400 B · cwnd ≥ 400 B · 손실 없음</text><text class="label" x="52" y="128" text-anchor="start">① ACK 수신 전 · 송신한 바이트 1000~1399</text><rect class="cell soft" x="192" y="165" width="103" height="62" data-byte-start="1000" data-state="sent"/><text class="mono" x="243" y="190" text-anchor="middle">1000</text><text class="small" x="243" y="213" text-anchor="middle">전송함</text><rect class="cell soft" x="302" y="165" width="103" height="62" data-byte-start="1100" data-state="sent"/><text class="mono" x="353" y="190" text-anchor="middle">1100</text><text class="small" x="353" y="213" text-anchor="middle">전송함</text><rect class="cell soft" x="412" y="165" width="103" height="62" data-byte-start="1200" data-state="sent"/><text class="mono" x="463" y="190" text-anchor="middle">1200</text><text class="small" x="463" y="213" text-anchor="middle">전송함</text><rect class="cell soft" x="522" y="165" width="103" height="62" data-byte-start="1300" data-state="sent"/><text class="mono" x="573" y="190" text-anchor="middle">1300</text><text class="small" x="573" y="213" text-anchor="middle">전송함</text><rect class="cell " x="632" y="165" width="103" height="62" data-byte-start="1400" data-state="available"/><text class="mono" x="683" y="190" text-anchor="middle">1400</text><text class="small" x="683" y="213" text-anchor="middle">범위 밖</text><rect class="cell " x="742" y="165" width="103" height="62" data-byte-start="1500" data-state="available"/><text class="mono" x="793" y="190" text-anchor="middle">1500</text><text class="small" x="793" y="213" text-anchor="middle">범위 밖</text><rect class="dash" x="186" y="151" width="446" height="91" data-window="1000-1399"/><text class="label" x="52" y="268" text-anchor="start">ACK = 1200</text><text class="sub" x="190" y="268" text-anchor="start">수신자가 다음에 기대하는 바이트는 1200</text><line class="div" x1="52" y1="286" x2="965" y2="286"/><text class="label" x="52" y="327" text-anchor="start">② ACK 수신 후 · 1000~1199 누적 확인</text><rect class="cell " x="192" y="361" width="103" height="62" data-byte-start="1000" data-state="acked"/><rect x="192" y="361" width="103" height="62" fill="url(#hatch)"/><text class="mono" x="243" y="386" text-anchor="middle">1000</text><text class="small" x="243" y="409" text-anchor="middle">확인됨</text><rect class="cell " x="302" y="361" width="103" height="62" data-byte-start="1100" data-state="acked"/><rect x="302" y="361" width="103" height="62" fill="url(#hatch)"/><text class="mono" x="353" y="386" text-anchor="middle">1100</text><text class="small" x="353" y="409" text-anchor="middle">확인됨</text><rect class="cell soft" x="412" y="361" width="103" height="62" data-byte-start="1200" data-state="sent"/><text class="mono" x="463" y="386" text-anchor="middle">1200</text><text class="small" x="463" y="409" text-anchor="middle">전송함</text><rect class="cell soft" x="522" y="361" width="103" height="62" data-byte-start="1300" data-state="sent"/><text class="mono" x="573" y="386" text-anchor="middle">1300</text><text class="small" x="573" y="409" text-anchor="middle">전송함</text><rect class="cell " x="632" y="361" width="103" height="62" data-byte-start="1400" data-state="available"/><text class="mono" x="683" y="386" text-anchor="middle">1400</text><text class="small" x="683" y="409" text-anchor="middle">전송 가능</text><rect class="cell " x="742" y="361" width="103" height="62" data-byte-start="1500" data-state="available"/><text class="mono" x="793" y="386" text-anchor="middle">1500</text><text class="small" x="793" y="409" text-anchor="middle">전송 가능</text><rect class="dash" x="406" y="347" width="446" height="91" data-window="1200-1599"/><text class="small" x="52" y="481" text-anchor="start">점선 = 송신 윈도우 · 빗금 = ACK 확인 · 회색 = 송신했으나 ACK 대기</text></svg>
